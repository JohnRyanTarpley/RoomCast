<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27303d"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity=".08"/>
    </linearGradient>
    <clipPath id="floorclip"><path d="M256 250 392 328 256 406 120 328Z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- room: open box seen from above -->
  <path d="M256 250 392 328 256 406 120 328Z" fill="url(#floor)"/>
  <g fill="none" stroke="#7fb2ff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <path d="M256 94 392 172 392 328 256 406 120 328 120 172Z"/>
    <path d="M256 94V250M256 250 120 328M256 250 392 328" stroke-opacity=".55"/>
  </g>
  <!-- sound spreading across the floor from the listener -->
  <g clip-path="url(#floorclip)" fill="none" stroke="#ffffff" stroke-width="10">
    <ellipse cx="256" cy="328" rx="52" ry="30" stroke-opacity=".9"/>
    <ellipse cx="256" cy="328" rx="94" ry="54" stroke-opacity=".5"/>
  </g>
  <circle cx="256" cy="328" r="17" fill="#ffffff"/>
  <!-- speakers at the corners -->
  <g stroke="#10131a" stroke-width="8">
    <circle cx="256" cy="250" r="27" fill="#51cf66"/>
    <circle cx="120" cy="328" r="27" fill="#ff6b6b"/>
    <circle cx="392" cy="328" r="27" fill="#4dabf7"/>
    <circle cx="256" cy="406" r="27" fill="#fcc419"/>
  </g>
</svg>
